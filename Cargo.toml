[package]
name = "loom"
version = "0.1.0"
edition = "2021"
description = "Intent graph CLI for LLM-driven codebase understanding"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
grafeo = "0.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
ignore = "0.4"
# Saga engine (consumer-plane proofs) — pure Rust by design: reqwest on rustls
# (no libcurl/native-tls), RFC 9535 JSONPath. See `src/saga/`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_yaml = "0.9"
serde_json_path = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
