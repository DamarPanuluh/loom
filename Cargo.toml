[package]
name = "loom"
version = "0.2.0"
edition = "2021"
description = "Intent graph CLI for LLM-driven codebase understanding"

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
ignore = "0.4"
# Saga engine (consumer-plane proofs) — pure Rust by design: reqwest on rustls
# (no libcurl/native-tls), RFC 9535 JSONPath. See `src/saga/`.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_yaml = "0.9"
serde_json_path = "0.7"
tree-sitter = { version = "0.26.9", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }

[features]
default = ["treesitter"]
treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
    "dep:tree-sitter-javascript",
    "dep:tree-sitter-python",
]

[profile.release]
lto = "thin"
codegen-units = 1
