[package]
name = "loom"
version = "0.9.0"
edition = "2021"
description = "A falsifiable graph of what a codebase should do, where it lives, and how it is proven."

[[bin]]
name = "loom"
path = "src/main.rs"

[lib]
name = "loom"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
anyhow = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.dev]
# first build pulls bundled SQLite; incremental builds stay fast
opt-level = 0
