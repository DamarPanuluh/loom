[package]
name = "loom"
version = "0.31.2"
edition = "2021"
description = "A falsifiable graph of what a codebase should do, where it lives, and how it is proven."

[[bin]]
name = "loom"
path = "src/main.rs"

[lib]
name = "loom"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
url = "2"
anyhow = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
# reqwest 0.13 renamed the TLS features (`rustls-tls` → `rustls`) and moved
# RequestBuilder::query behind the `query` feature
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rusqlite_migration = "2.6"
process_control = "5"
ignore = "0.4"
globset = "0.4"
petgraph = "0.8"
regex = "1.12.4"
libc = "0.2.186"

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"

[profile.dev]
# first build pulls bundled SQLite; incremental builds stay fast
opt-level = 0
