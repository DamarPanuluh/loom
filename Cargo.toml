[package]
name = "loom"
version = "0.19.1"
edition = "2021"
description = "A falsifiable graph of what a codebase should do, where it lives, and how it is proven."

[[bin]]
name = "loom"
path = "src/main.rs"

[lib]
name = "loom"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
fs2 = "0.4"
anyhow = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite_migration = "1.2.0"
process_control = "5"
ignore = "0.4"
globset = "0.4"
petgraph = "0.8"
regex = "1.12.4"
libc = "0.2.186"

[dev-dependencies]
insta = { version = "1", features = ["json", "redactions"] }
proptest = "1"

[profile.dev]
# first build pulls bundled SQLite; incremental builds stay fast
opt-level = 0
