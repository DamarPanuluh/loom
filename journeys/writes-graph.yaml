schema: loom.journey/v1
id: writes-graph
name: Propose graph writes from observed repository work
actor: operator
goal: Loom reads repository evidence and proposes typed graph mutations instead of
  asking the operator to restate the work.
inputs: {}
preconditions:
- The repository contains registered code whose observed behavior is not yet represented
  in the graph.
steps:
- id: inspect-repository-work
  name: Inspect Repository Work
  action: Ask Loom to absorb the current repository state.
  expects:
  - Loom proposes typed graph mutations and includes the repository evidence behind
    each proposal.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
