schema: loom.journey/v1
id: dependents
name: Inspect what stands on a behavior
actor: operator
goal: An operator can see transitive dependents, their distance, and their proof exposure.
inputs: {}
preconditions:
- A far behavior requires a middle behavior, which requires a foundation behavior,
  and none has a current proof.
- Another behavior has no dependents.
steps:
- id: inspect-foundation-dependents
  name: Inspect Foundation Dependents
  action: Ask what behaviors stand on the foundation behavior.
  expects:
  - The middle and far behaviors are reported at one and two hops with their unproven
    exposure made explicit.
  produces: {}
- id: inspect-standalone-dependents
  name: Inspect Standalone Dependents
  action: Ask what behaviors stand on the standalone behavior.
  expects:
  - Loom states plainly that nothing stands on or is reached from the standalone behavior.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
