journey: loom answers what stands on a behavior
steps:
  - name: a transitive dependent is reported with its distance and proof state
    fixture: true
    intent: loom answers what other behaviors stand on this one
    # Seed a chain in a throwaway graph — A requires B, B requires C — then ask
    # what stands on C. A is two hops away and nothing proves it, which is
    # exactly the case this command exists to surface.
    # Every line at one indent level: a folded scalar keeps the newline on any
    # MORE-indented line and would split a command in half.
    run: >-
      tmp=$(mktemp -d) && loom init "$tmp" --name t &&
      loom intent add --graph "$tmp" --name 'A the far dependent' --description 'stands on B' --lifecycle implemented &&
      loom intent add --graph "$tmp" --name 'B the middle' --description 'stands on C' --lifecycle implemented &&
      loom intent add --graph "$tmp" --name 'C the foundation' --description 'the thing everything stands on' --lifecycle implemented &&
      loom edge relate --graph "$tmp" requires 'A the far dependent' 'B the middle' &&
      loom edge relate --graph "$tmp" requires 'B the middle' 'C the foundation' &&
      loom intent dependents --graph "$tmp" 'C the foundation'; rc=$?; rm -rf "$tmp"; exit $rc
    expect:
      exit_code: 0
      stdout_contains:
        - "2 behavior(s) stand on"
        - "1 hop"
        - "2 hops"
        - "A the far dependent"
        - "UNPROVEN"
        - "would not be caught there"

  - name: a behavior nothing points at says so plainly
    fixture: true
    intent: loom answers what other behaviors stand on this one
    run: >-
      tmp=$(mktemp -d) && loom init "$tmp" --name t &&
      loom intent add --graph "$tmp" --name 'stands alone' --description 'nothing depends on it' --lifecycle implemented &&
      loom intent dependents --graph "$tmp" 'stands alone'; rc=$?; rm -rf "$tmp"; exit $rc
    expect:
      exit_code: 0
      stdout_contains: ["nothing stands on", "reaches no other behavior"]
