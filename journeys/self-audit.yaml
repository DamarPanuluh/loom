schema: loom.journey/v1
id: self-audit
name: Audit Loom's own record for falsifiability
actor: operator
goal: The audit distinguishes a clean record from a deliberately seeded judgment burst
  and explains how to repair findings.
inputs: {}
preconditions:
- One graph contains no audit findings.
- Another graph contains a fast batch of judgments covered by one prior human decision
  over the exact presented subject set.
- Another graph contains a deliberately seeded burst of similarly timed judgments.
steps:
- id: audit-clean-graph
  name: Audit Clean Graph
  action: Audit the clean graph.
  expects:
  - Loom explicitly reports an empty finding set and a successful audit.
  produces: {}
- id: audit-authorized-batch
  name: Audit Authorized Batch
  action: Audit the graph after a human approves a presented table of judgments as one
    batch and an LLM records the covered writes.
  expects:
  - Loom recognizes the prior hash-bound human batch authorization and does not report
    the covered fast judgments as a suspicious burst.
  - Any extra or changed judgment outside the exact approved set remains unauthorised
    and is reported.
  produces: {}
- id: audit-defective-graph
  name: Audit Defective Graph
  action: Audit the graph containing the seeded judgment burst.
  expects:
  - Loom reports the judgment burst by kind and detail, supplies a remedy, and marks
    the audit unsuccessful.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
