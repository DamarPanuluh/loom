schema: loom.journey/v1
id: ratify-guard
name: Refuse automated human ratification
actor: autonomous worker
goal: An autonomous actor cannot manufacture evidence of a human wantedness decision.
inputs: {}
preconditions:
- A behavior is eligible for ratification but no human has answered the decision.
steps:
- id: attempt-automated-ratification
  name: Attempt Automated Ratification
  action: Attempt to record the behavior as wanted without an interactive human answer.
  expects:
  - Loom refuses the attempt and explains that automated evidence is indistinguishable
    from an LLM assertion.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
