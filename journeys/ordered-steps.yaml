schema: loom.journey/v1
id: ordered-steps
name: Serve ordered work in readiness order
actor: operator
goal: A later behavior remains blocked until the behavior it follows has been realized.
inputs: {}
preconditions:
- Checkout follows adding an item to a cart, and neither behavior has yet been realized.
steps:
- id: request-work-before-prerequisite
  name: Request Work Before Prerequisite
  action: Ask for build work while both ordered behaviors remain unrealized.
  expects:
  - Loom serves add-to-cart and keeps checkout blocked by name.
  produces: {}
- id: realize-earlier-behavior
  name: Realize Earlier Behavior
  action: Realize the add-to-cart behavior.
  expects: []
  produces: {}
- id: request-work-after-prerequisite
  name: Request Work After Prerequisite
  action: Ask for build work again.
  expects:
  - Loom serves checkout after the earlier behavior is realized.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
