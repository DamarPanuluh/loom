schema: loom.journey/v1
id: unratified-ungated
name: Keep unapproved derivations out of autonomous build
actor: operator
goal: A proposed technical derivation remains visible for conversational review but
  cannot create authoritative Intents or enter autonomous build work before acceptance.
inputs: {}
preconditions:
- An authored Journey has a proposed derivation manifest that the human has not accepted.
steps:
- id: inspect-proposal-state
  name: Inspect Proposal State
  action: Inspect the proposed derivation and the autonomous build queue before human acceptance.
  expects:
  - The proposal remains non-authoritative and creates no ratified Intent or Derives
    relationship.
  - No work from the unapproved proposal appears in build or counts toward Journey readiness.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
