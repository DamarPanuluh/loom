schema: loom.journey/v1
id: reopens-claims
name: Reopen only claims whose anchors changed
actor: developer
goal: Repository changes invalidate the settled claims that point at changed evidence
  while sparing unrelated groundings.
inputs: {}
preconditions:
- Two settled grounding claims point to distinct symbols with cited evidence.
steps:
- id: change-one-grounded-symbol
  name: Change One Grounded Symbol
  action: Change one grounded symbol while leaving the other symbol untouched.
  expects: []
  produces: {}
- id: synchronize-changed-repository
  name: Synchronize Changed Repository
  action: Synchronize the graph with the repository.
  expects:
  - The grounding that points at the changed symbol needs reverification.
  - The grounding for the untouched symbol remains settled.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
