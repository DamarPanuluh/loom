schema: loom.journey/v1
id: door-capture
name: Capture and route a new topic
actor: operator
goal: An operator captures free-form input, chooses its destination, and can inspect
  the persisted disposition.
inputs:
  topic:
    type: string
    description: The free-form topic entering Loom.
    default: ship a faster checkout flow
preconditions: []
steps:
- id: submit-topic
  name: Submit Topic
  action: Submit the topic through Loom's intake door.
  expects:
  - Loom preserves the topic and offers typed destinations for it.
  produces: {}
- id: choose-destination
  name: Choose Destination
  action: Route the captured item from the offered landing menu.
  expects: []
  produces: {}
- id: inspect-disposition
  name: Inspect Disposition
  action: Inspect the captured item after routing.
  expects:
  - The item remains recorded with a routed disposition and its chosen destination.
  produces:
    captured-item:
      type: string
      description: The stable identifier of the captured intake item.
profiles:
  proof:
    inputs: {}
    workspace: {}
