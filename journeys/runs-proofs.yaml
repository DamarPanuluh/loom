journey: loom runs a proof and reports the outcome
steps:
  - name: a true command records passed
    fixture: true
    intent: loom runs proofs and reports what it observed
    run: >-
      tmp=$(mktemp -d) && loom init "$tmp" --name t &&
      loom intent add --graph "$tmp" --name 'demo behavior' --description 'does something' --level feature &&
      loom validation add --graph "$tmp" --name 'true proof' --type test --command 'true' --intent 'demo behavior' &&
      loom validation run --graph "$tmp" --all &&
      rm -rf "$tmp"
    expect:
      exit_code: 0
      stdout_contains: ["PASS true proof"]
