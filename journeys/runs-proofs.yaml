schema: loom.journey/v1
id: runs-proofs
name: Run a proof and report the observed outcome
actor: validator
goal: Loom executes a registered proof itself and records what the process actually
  did.
inputs: {}
preconditions:
- An implemented behavior has a registered proof that will pass when executed.
steps:
- id: run-registered-proof
  name: Run Registered Proof
  action: Ask Loom to execute the registered proof.
  expects:
  - Loom reports the proof as passing and records the observation rather than accepting
    a claimed result.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
