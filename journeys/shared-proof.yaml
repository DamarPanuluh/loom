schema: loom.journey/v1
id: shared-proof
name: Expose behaviors that borrow one proof's green state
actor: operator
goal: Loom distinguishes suspiciously shared proof mechanisms from a behavior with
  a proof of its own.
inputs: {}
preconditions:
- Two implemented behaviors are registered with the same proof mechanism.
- A third implemented behavior has a proof mechanism used only for that behavior.
steps:
- id: inspect-proof-sharing
  name: Inspect Proof Sharing
  action: Inspect the graph for proof-sharing risks.
  expects:
  - Loom reports the two behaviors sharing one mechanism and recommends narrowing
    each proof to what it proves.
  - Loom does not report the behavior whose proof mechanism is independent.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
