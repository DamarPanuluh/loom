schema: loom.journey/v1
id: locator-drift
name: Reopen a grounding when its locator disappears
actor: operator
goal: Synchronization distinguishes a vanished grounded symbol from a locator that
  still resolves.
inputs: {}
preconditions:
- Two settled groundings cite live symbols, after which one symbol is removed while
  the other remains unchanged.
steps:
- id: synchronize-after-symbol-change
  name: Synchronize After Symbol Change
  action: Synchronize the graph after the repository change.
  expects: []
  produces: {}
- id: inspect-grounding-states
  name: Inspect Grounding States
  action: Inspect both grounding claims after synchronization.
  expects:
  - The grounding whose locator no longer resolves needs reverification.
  - The unchanged grounding whose locator still resolves remains settled.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
