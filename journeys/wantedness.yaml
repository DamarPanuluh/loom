journey: wantedness is not presumed
steps:
  - name: an intent with no evidence reports unratified
    fixture: true
    intent: wantedness is earned from evidence, not demanded up front
    run: >-
      tmp=$(mktemp -d) && loom init "$tmp" --name t &&
      loom intent add --graph "$tmp" --name 'unspoken behavior' --description 'nobody has approved it' --level feature &&
      loom intent show --graph "$tmp" 'unspoken behavior' --json &&
      rm -rf "$tmp"
    expect:
      exit_code: 0
      stdout_contains: ['"ratification": "unratified"']
