- id: inspect-derived-strength
  name: Inspect Derived Strength
  action: Inspect the proof's derived strength.
  expects:
  - Loom grades the proof S1 because successful execution alone establishes liveness.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
