actor: validator
goal: A proof that establishes only successful execution receives a liveness grade
  rather than authored strength.
inputs: {}
preconditions:
- An implemented behavior has a proof that can complete successfully but makes no
  behavioral assertion.
steps:
- id: run-liveness-proof
  name: Run Liveness Proof
  action: Run the liveness-only proof.
  expects: []
