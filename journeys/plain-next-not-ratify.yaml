schema: loom.journey/v1
id: plain-next-not-ratify
name: Keep human decisions out of autonomous routing
actor: autonomous worker
goal: Ordinary next-work routing continues with autonomous work and never interrupts
  itself with a ratification decision.
inputs: {}
preconditions:
- At least one autonomous work lane contains actionable residue.
- A separate human-only ratification decision is pending.
steps:
- id: request-ordinary-next-work
  name: Request Ordinary Next Work
  action: Ask Loom for the next ordinary work item.
  expects:
  - Loom serves the highest-priority autonomous work packet and does not serve a
    human-only decision packet.
  - The pending human decision remains available through explicit ratify mode.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
