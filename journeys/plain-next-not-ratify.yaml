journey: plain next never serves a human-only ratify packet
steps:
  - name: default next serves builder work, not the ratify lane
    fixture: true
    intent: plain loom next never interrupts autonomous work with a human decision
    run: >-
      tmp=$(mktemp -d) && loom init "$tmp" --name t &&
      loom intent add --graph "$tmp" --name 'unspoken behavior' --description 'nobody has ratified it' --level feature &&
      loom next --graph "$tmp" --json &&
      rm -rf "$tmp"
    expect:
      exit_code: 0
      stdout_contains: ['"mode": "build"']
