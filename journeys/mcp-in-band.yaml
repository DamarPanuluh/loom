schema: loom.journey/v1
id: mcp-in-band
name: Use Loom through an in-band tool protocol
actor: MCP client
goal: An MCP client can discover Loom's capabilities, receive live graph data, and
  distinguish protocol errors from tool failures.
inputs: {}
preconditions:
- Loom is available to an MCP client over a live in-band session.
steps:
- id: discover-tools
  name: Discover Tools
  action: Initialize the session and request the available Loom tools.
  expects:
  - The client sees Loom's read and write capabilities with structured input descriptions.
  produces: {}
- id: inspect-live-impact
  name: Inspect Live Impact
  action: Invoke the impact capability for a symbol that exists in the graph.
  expects:
  - The result contains real caller and resolution information from the current graph.
  produces: {}
- id: request-unknown-tool
  name: Request Unknown Tool
  action: Invoke a tool name that Loom does not expose.
  expects:
  - Loom identifies the unknown name as an invalid request rather than a tool execution
    failure.
  produces: {}
- id: invoke-failing-tool
  name: Invoke Failing Tool
  action: Invoke an existing context capability with a target that cannot be resolved.
  expects:
  - Loom reports that the known tool failed and keeps the in-band session usable.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
