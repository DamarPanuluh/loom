schema: loom.journey/v1
id: divergence-queue
name: Present divergence as a conversational human decision
actor: operator
goal: Concrete evidence and human judgment disagreements become recommendation-first
  conversational decisions while agent-resolvable friction remains autonomous.
inputs: {}
preconditions:
- The graph contains a disagreement between recorded evidence and wantedness judgment.
steps:
- id: inspect-human-decision-work
  name: Inspect Human Decision Work
  action: Inspect the next item that requires a human decision.
  expects:
  - Loom returns only a concrete judgment-evidence conflict, not merely missing approval
    or agent-resolvable friction.
  - The host agent presents the graph state, evidence, recommendation, reasoning,
    choices, and revision path needed for a conversational decision.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
