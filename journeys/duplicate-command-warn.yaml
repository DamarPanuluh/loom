schema: loom.journey/v1
id: duplicate-command-warn
name: Warn when two behaviors share one proof mechanism
actor: operator
goal: Registering a proof that duplicates another behavior's mechanism remains possible
  but immediately exposes the coupling.
inputs: {}
preconditions:
- A first implemented behavior already has a registered proof mechanism.
steps:
- id: register-second-proof
  name: Register Second Proof
  action: Register the same proof mechanism for a second implemented behavior.
  expects:
  - Loom accepts the registration while warning that the mechanism already proves
    the first behavior.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
