schema: loom.journey/v1
id: proof-stability
name: Report a proof that flips over unchanged code
actor: validator
goal: Contradictory proof outcomes over the same code anchors become visible as instability.
inputs: {}
preconditions:
- An implemented behavior has a settled grounding and a repeatable proof.
steps:
- id: observe-passing-proof
  name: Observe Passing Proof
  action: Run the proof and observe it passing without changing the grounded code.
  expects: []
  produces: {}
- id: observe-failing-proof
  name: Observe Failing Proof
  action: Run the same proof again and observe it failing while the grounded code
    remains unchanged.
  expects: []
  produces: {}
- id: inspect-structural-signals
  name: Inspect Structural Signals
  action: Inspect the graph's structural signals.
  expects:
  - Loom reports the proof as unstable and explains that the result flipped over unchanged
    code.
  produces: {}
profiles:
  proof:
    inputs: {}
    workspace: {}
