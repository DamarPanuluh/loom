name: Manual CI fallback

on:
  # Local CI is installed with:
  # loom hook install --pre-push scripts/local-ci.sh
  # Pushes and pull requests never run hosted jobs.
  # Version tags v* publish prebuilt binaries to GitHub Releases.
  workflow_dispatch:
    inputs:
      publish_binaries:
        description: Build release binaries for this ref (artifacts only unless this is a v* tag)
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dogfood:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_binaries != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Verify code and the living intent graph
        run: scripts/local-ci.sh

  release-binaries:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_binaries == true)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Pack archive
        run: |
          mkdir -p dist
          bin="target/${{ matrix.target }}/release/loom"
          strip "$bin" || true
          tar -C "$(dirname "$bin")" -czf "dist/loom-${{ matrix.target }}.tar.gz" loom
          (cd dist && shasum -a 256 "loom-${{ matrix.target }}.tar.gz" > "loom-${{ matrix.target }}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: loom-${{ matrix.target }}
          path: dist/*

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
