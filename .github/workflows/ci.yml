name: Manual CI fallback

on:
  # Local CI is installed with:
  # loom hook install --pre-push scripts/local-ci.sh
  # Keep this only as an explicit fallback; it never consumes hosted minutes
  # for pushes or pull requests.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Verify code and the living intent graph
        run: scripts/local-ci.sh
